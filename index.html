<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pro Agenda">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#faf9fe">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <title>Pro Agenda</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Hanken+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css?v=20260626b">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: '#faf9fe', 'surface-dim': '#dad9df', 'surface-bright': '#faf9fe',
            'surface-container-lowest': '#ffffff', 'surface-container-low': '#f4f3f8',
            'surface-container': '#eeedf3', 'surface-container-high': '#e9e7ed',
            'surface-container-highest': '#e3e2e7', 'on-surface': '#1a1b1f',
            'on-surface-variant': '#424753', 'inverse-surface': '#2f3034',
            'inverse-on-surface': '#f1f0f5', outline: '#737784',
            'outline-variant': '#c2c6d5', 'surface-tint': '#0459c5',
            primary: '#0459c5', 'on-primary': '#ffffff',
            'primary-container': '#5891ff', 'on-primary-container': '#002a65',
            'inverse-primary': '#afc6ff', secondary: '#5f5e5e',
            'on-secondary': '#ffffff', 'secondary-container': '#e2dfde',
            'on-secondary-container': '#636262', tertiary: '#5d5e63',
            'on-tertiary': '#ffffff', 'tertiary-container': '#939499',
            'on-tertiary-container': '#2b2d31', error: '#ba1a1a',
            'on-error': '#ffffff', 'error-container': '#ffdad6',
            'on-error-container': '#93000a', 'primary-fixed': '#d9e2ff',
            'primary-fixed-dim': '#afc6ff', 'on-primary-fixed': '#001a43',
            'on-primary-fixed-variant': '#004398', 'secondary-fixed': '#e5e2e1',
            'secondary-fixed-dim': '#c8c6c5', 'on-secondary-fixed': '#1c1b1b',
            'on-secondary-fixed-variant': '#474746', 'tertiary-fixed': '#e2e2e7',
            'tertiary-fixed-dim': '#c6c6cb', 'on-tertiary-fixed': '#1a1c1f',
            'on-tertiary-fixed-variant': '#45474b', background: '#faf9fe',
            'on-background': '#1a1b1f', 'surface-variant': '#e3e2e7'
          },
          borderRadius: { DEFAULT: '0.125rem', lg: '0.25rem', xl: '0.5rem', '2xl': '0.75rem', full: '9999px' },
          spacing: { unit: '8px', gutter: '16px', 'margin-tablet': '32px', 'time-column-width': '80px', 'sidebar-width': '280px' },
          fontFamily: {
            'headline-sm': ['Hanken Grotesk'], 'headline-lg': ['Hanken Grotesk'],
            'display-xl': ['Hanken Grotesk'], 'body-md': ['Inter'],
            'body-sm': ['Inter'], 'label-mono': ['JetBrains Mono']
          },
          fontSize: {
            'headline-sm': ['18px', { lineHeight: '24px', fontWeight: '600' }],
            'headline-lg': ['32px', { lineHeight: '40px', letterSpacing: '-0.02em', fontWeight: '600' }],
            'display-xl': ['96px', { lineHeight: '100px', letterSpacing: '-0.04em', fontWeight: '700' }],
            'body-sm': ['14px', { lineHeight: '20px', fontWeight: '400' }],
            'body-md': ['16px', { lineHeight: '24px', fontWeight: '400' }],
            'label-mono': ['12px', { lineHeight: '16px', letterSpacing: '0.05em', fontWeight: '500' }]
          }
        }
      }
    };
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="bg-surface text-on-surface overflow-hidden flex flex-col" style="height:100vh;height:100dvh">
  <!-- Top Navigation Bar -->
  <header class="flex items-center justify-between px-1 py-1.5 bg-surface border-b border-outline-variant shrink-0 z-20" style="padding-top:max(6px,env(safe-area-inset-top,6px))">
    <div class="flex items-center gap-0.5">
      <button class="nav-btn flex items-center justify-center w-9 h-9 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-all" data-view="day" title="DIA">
        <span class="material-symbols-outlined text-[20px]">calendar_view_day</span>
      </button>
      <button class="nav-btn flex items-center justify-center w-9 h-9 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-all" data-view="week" title="SEMANA">
        <span class="material-symbols-outlined text-[20px]">calendar_view_week</span>
      </button>
      <button class="nav-btn active flex items-center justify-center w-9 h-9 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-all" data-view="month" title="MÊS">
        <span class="material-symbols-outlined text-[20px]">calendar_view_month</span>
      </button>
      <button class="nav-btn flex items-center justify-center w-9 h-9 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-all" data-view="year" title="ANO">
        <span class="material-symbols-outlined text-[20px]">calendar_today</span>
      </button>
      <button class="nav-btn flex items-center justify-center w-9 h-9 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-all" data-view="notes" title="NOTAS">
        <span class="material-symbols-outlined text-[20px]">sticky_note_2</span>
      </button>
      <div class="w-px h-5 bg-outline-variant/30 mx-1"></div>
      <button id="nav-prev" class="flex items-center justify-center w-8 h-8 rounded-lg text-on-surface-variant hover:bg-surface-container-low">
        <span class="material-symbols-outlined text-[16px]">chevron_left</span>
      </button>
      <div class="text-center min-w-[90px]">
        <h2 id="topbar-title" class="font-headline-sm text-[13px] text-on-surface leading-tight">Junho 2026</h2>
        <p id="topbar-subtitle" class="font-body-sm text-[9px] text-on-surface-variant/60 hidden leading-none"></p>
      </div>
      <button id="nav-next" class="flex items-center justify-center w-8 h-8 rounded-lg text-on-surface-variant hover:bg-surface-container-low">
        <span class="material-symbols-outlined text-[16px]">chevron_right</span>
      </button>
    </div>
    <div class="flex items-center gap-1">
      <button id="nav-today" class="px-2.5 py-1 bg-primary text-on-primary rounded-lg text-[10px] font-semibold hover:opacity-90">
        Hoje
      </button>
    </div>
  </header>



  <!-- Body -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Day Sidebar (only in day view) -->
    <aside id="day-sidebar" class="hidden w-[280px] flex-col border-r border-outline-variant bg-surface-container-low overflow-y-auto shrink-0">
      <div class="p-4 flex flex-col gap-4">
        <div class="flex flex-col">
          <span id="sidebar-day-name" class="font-body-sm text-[11px] text-secondary uppercase tracking-widest">segunda-feira</span>
          <span id="sidebar-day-number" class="font-display-xl text-[56px] text-primary leading-none -ml-1">22</span>
          <span id="sidebar-day-month" class="font-headline-sm text-[12px] text-on-surface-variant uppercase tracking-widest">JUNHO 2026</span>
        </div>
        <div id="sidebar-highlight">
          <div class="bg-primary/10 rounded-xl border-l-4 border-primary relative overflow-hidden shadow-sm" style="aspect-ratio:2/1;max-width:100%">
            <div class="absolute top-2 left-3 font-label-mono text-[9px] text-primary/60 uppercase tracking-widest z-10">Destaque</div>
            <canvas id="highlight-canvas" class="absolute inset-0 w-full h-full" style="touch-action:none;cursor:crosshair"></canvas>
            <div class="absolute bottom-2 right-3 z-10">
              <span class="material-symbols-outlined text-primary text-lg opacity-80" style="font-variation-settings:'FILL' 1">star</span>
            </div>
          </div>
          <div id="highlight-tools" class="flex items-center gap-1.5 mt-2 flex-wrap"></div>
        </div>
        <div id="sidebar-next-event" class="bg-surface p-3 rounded-xl border border-outline-variant">
          <h3 class="font-label-mono text-[10px] text-secondary mb-1 tracking-widest uppercase">Próximo evento</h3>
          <p class="font-body-sm font-semibold text-on-surface">—</p>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden bg-background">
      <!-- View: MÊS -->
      <div id="view-month" class="view active">
        <div class="flex-1 flex flex-col bg-surface" style="overflow:clip">
          <div class="grid grid-cols-7 bg-surface-container-low border-b border-outline-variant shrink-0">
            <div class="py-2 text-center font-label-mono text-[10px] text-error">DOM</div>
            <div class="py-2 text-center font-label-mono text-[10px] text-secondary">SEG</div>
            <div class="py-2 text-center font-label-mono text-[10px] text-secondary">TER</div>
            <div class="py-2 text-center font-label-mono text-[10px] text-secondary">QUA</div>
            <div class="py-2 text-center font-label-mono text-[10px] text-secondary">QUI</div>
            <div class="py-2 text-center font-label-mono text-[10px] text-secondary">SEX</div>
            <div class="py-2 text-center font-label-mono text-[10px] text-secondary">SÁB</div>
          </div>
          <div id="month-grid" class="calendar-grid flex-1"></div>
        </div>
      </div>

      <!-- View: SEMANA -->
      <div id="view-week" class="view">
        <div class="flex-1 overflow-auto">
          <div id="week-grid" class="flex bg-surface min-h-full"></div>
        </div>
      </div>

      <!-- View: DIA -->
      <div id="view-day" class="view">
        <div class="flex-1 overflow-hidden relative">
          <div id="day-grid" class="bg-white relative flex flex-col h-full"></div>
        </div>
      </div>

      <!-- View: ANO -->
      <div id="view-year" class="view" style="padding:16px;overflow:hidden">
        <div id="year-grid" class="grid grid-cols-4 gap-4 flex-1 min-h-0"></div>
      </div>

      <!-- View: NOTAS -->
      <div id="view-notes" class="view">
        <div class="flex-1 overflow-auto p-gutter">
          <div class="max-w-[800px] mx-auto">
            <div id="notes-list" class="grid grid-cols-2 gap-4"></div>
            <div id="notes-editor" class="hidden">
              <div class="flex items-center gap-3 mb-4">
                <button id="notes-back-btn" class="hidden p-2 hover:bg-surface-container-low rounded-lg">
                  <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <button id="notes-delete-btn" class="hidden p-2 hover:bg-error-container rounded-lg text-error">
                  <span class="material-symbols-outlined">delete</span>
                </button>
                <div id="notes-tools" class="flex items-center gap-1.5 ml-auto"></div>
              </div>
              <input id="notes-editor-title" type="text" placeholder="Título" class="font-headline-lg text-[28px] text-on-surface bg-transparent border-none outline-none w-full mb-4 placeholder:text-outline-variant">
              <div id="notes-canvas-wrap" class="relative bg-surface-container-low rounded-xl overflow-hidden" style="touch-action:none;height:62vh">
                <div class="planner-canvas absolute inset-0 pointer-events-none opacity-60"></div>
                <canvas id="notes-canvas" class="draw-canvas absolute inset-0 w-full h-full"></canvas>
                <span id="notes-canvas-hint" class="absolute top-3 left-4 text-[12px] text-outline-variant pointer-events-none">Escreva com a caneta…</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Botão de nova nota (só na aba Notas) -->
  <button id="notes-fab" class="hidden fixed bottom-margin-tablet right-margin-tablet w-12 h-12 bg-primary text-on-primary rounded-xl shadow-lg flex items-center justify-center hover:scale-105 active:scale-95 transition-transform z-30 cursor-pointer" title="Nova nota">
    <span class="material-symbols-outlined text-[22px]">add</span>
  </button>

  <!-- Detail Overlay -->
  <div id="detail-overlay" class="hidden fixed inset-0 bg-surface/80 backdrop-blur-sm z-40 items-center justify-center p-8">
    <div id="detail-content" class="w-full max-w-lg"></div>
  </div>

  <script src="src/data.js?v=20260626b"></script>
  <script src="src/app.js?v=20260626b"></script>
</body>
</html>
